<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#05070d" />
        <title>Test Drive 1987</title>
        <link rel="stylesheet" href="css/style.css" />
        <script type="importmap">
            {
                "imports": {
                    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.min.js",
                    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/objects/"
                }
            }
        </script>
        <script type="module" src="src/main.js"></script>
    </head>
    <body>
        <main id="stage"></main>
        <div id="touch-controls" aria-hidden="true">
            <div class="cluster left">
                <button data-action="steerLeft">◀</button>
                <button data-action="steerRight">▶</button>
            </div>
            <div class="cluster right">
                <button data-action="shiftDown">−</button>
                <button data-action="shiftUp">+</button>
                <button data-action="brake">▼</button>
                <button data-action="throttle">▲</button>
            </div>
        </div>
    </body>
</html>
