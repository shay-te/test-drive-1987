# Publishes the game to GitHub Pages (the gh-pages branch) on every push to master, once the tests pass.
name: Publish to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Test
              run: npm test
            - name: Copy the site into the gh-pages branch (no build step; three.js comes from the CDN)
              run: |
                  git fetch origin gh-pages
                  git worktree add site origin/gh-pages
                  rm -rf site/index.html site/css site/src site/assets site/LICENSE
                  cp -r index.html preview.html css src assets LICENSE site/
                  touch site/.nojekyll
                  cd site
                  git add -A
                  git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Publish ${GITHUB_SHA::7}" || exit 0
                  git push origin HEAD:gh-pages
