# Publishes the game to GitHub Pages on every push to master, once the tests pass.
name: Deploy to GitHub Pages

on:
    push:
        branches: [master]
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

concurrency:
    group: pages
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - name: Test
              run: npm test
            - name: Collect the site (no build step; three.js comes from the CDN)
              run: |
                  mkdir _site
                  cp -r index.html css src assets LICENSE _site/
                  touch _site/.nojekyll
            - uses: actions/configure-pages@v5
            - uses: actions/upload-pages-artifact@v3
              with:
                  path: _site
            - id: deployment
              uses: actions/deploy-pages@v4
